databases:
  - name: knowza-db
    databaseName: knowza
    user: knowza_user
    plan: free

services:
  - type: web
    name: knowza-platform
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: knowza-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
